<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cash Piggy Wheel 🐷💰</title>
  <style>
    :root{
      /* Responsive sizes so everything fits */
      --mainWheel: clamp(320px, min(70vw, 70vh), 600px);
      --mainWrap:  calc(var(--mainWheel) + 40px);

      --multWheel: clamp(220px, min(42vw, 42vh), 350px);
      --multWrap:  calc(var(--multWheel) + 30px);

      --sidebarW:  clamp(280px, 92vw, 520px);
      --sidebarH:  clamp(280px, 38vh, 330px);
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ff99cc 0, #111 55%);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }

    .app {
      width: min(1200px, 100vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 10px;
      box-sizing: border-box;
    }

    /* Row that holds main + multiplier wheels */
    .wheels-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap; /* IMPORTANT: allows fit on small screens */
      width: 100%;
    }

    /* ---------- MAIN WHEEL ---------- */
    .wheel-wrapper {
      position: relative;
      width: var(--mainWrap);
      height: var(--mainWrap);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .wheel {
      width: var(--mainWheel);
      height: var(--mainWheel);
      border-radius: 50%;
      border: clamp(6px, 1.2vw, 10px) solid #ff66aa;
      box-shadow: 0 0 24px rgba(0,0,0,0.9);
      position: relative;
      transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1);
      transform: rotate(0deg);
      background: conic-gradient(
        #c40000 0deg 36deg,
        #000000 36deg 72deg,
        #c40000 72deg 108deg,
        #000000 108deg 144deg,
        #c40000 144deg 180deg,
        #000000 180deg 216deg,
        #c40000 216deg 252deg,
        #000000 252deg 288deg,
        #c40000 288deg 324deg,
        #000000 324deg 360deg
      );
    }

    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      color: #fff;
      font-size: clamp(12px, 2.2vw, 20px);
      font-weight: 800;
      text-shadow: 0 0 3px #000;
      width: clamp(52px, 10vw, 80px);
      text-align: center;
      line-height: 1.1;
      pointer-events: none;
      user-select: none;
    }

    .pointer {
      position: absolute;
      top: clamp(-20px, -2.2vw, -22px);
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: clamp(14px, 2.8vw, 22px) solid transparent;
      border-right: clamp(14px, 2.8vw, 22px) solid transparent;
      border-bottom: clamp(22px, 4.2vw, 34px) solid #ffffff;
      filter: drop-shadow(0 0 4px #000);
      z-index: 20;
    }

    /* ---------- PIG VIDEO ---------- */
    .pig-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(180px, 35vw, 300px);
      max-width: 70%;
      height: auto;
      display: none;
      z-index: 45;
      border-radius: 14px;
      box-shadow: 0 0 18px rgba(0,0,0,0.9);
      pointer-events: none;
      user-select: none;
    }

    /* Big win overlay */
    .big-win-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00ff66;
      color: #00ff66;
      font-size: clamp(14px, 2.8vw, 22px);
      font-weight: bold;
      text-shadow: 0 0 6px #000;
      display: none;
      white-space: nowrap;
      z-index: 40;
      animation: piggy-pop 0.6s ease-out forwards;
      pointer-events: none;
      user-select: none;
    }

    /* Keep Spinning overlay */
    .send-now-overlay {
      position: absolute;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ffcc00;
      color: #ffcc00;
      font-size: clamp(14px, 3vw, 24px);
      font-weight: 900;
      text-shadow: 0 0 6px #000;
      display: none;
      white-space: nowrap;
      z-index: 40;
      animation: send-flash 1s linear infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes piggy-pop {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      50%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes send-flash {
      0%   { opacity: 0.1; transform: translate(-50%, -50%) scale(0.95); }
      50%  { opacity: 1;   transform: translate(-50%, -50%) scale(1.05); }
      100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.98); }
    }

    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: clamp(10px, 1.6vw, 14px) clamp(18px, 3.4vw, 32px);
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff66aa, #ff3366);
      color: #fff;
      font-size: clamp(14px, 2.8vw, 20px);
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0,0,0,0.8);
      z-index: 35;
    }
    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ---------- MULTIPLIER WHEEL ---------- */
    .mult-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      width: var(--multWrap);
      flex: 0 0 auto;
    }

    .mult-title {
      font-size: clamp(14px, 2.4vw, 18px);
      margin-bottom: 2px;
    }

    .mult-locked {
      font-size: clamp(12px, 2.2vw, 14px);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #888;
      color: #ddd;
      white-space: nowrap;
      user-select: none;
      text-align: center;
    }

    .mult-inner {
      position: relative;
      width: calc(var(--multWheel) + 30px);
      height: calc(var(--multWheel) + 30px);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .mult-wrapper.unlocked .mult-inner { display: flex; }
    .mult-wrapper.unlocked .mult-locked { display: none; }

    .mult-wheel {
      width: var(--multWheel);
      height: var(--multWheel);
      border-radius: 50%;
      border: clamp(5px, 1.2vw, 8px) solid #44ddaa;
      box-shadow: 0 0 18px rgba(0,0,0,0.9);
      position: relative;
      transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1);
      transform: rotate(0deg);
      background: conic-gradient(
        #146b3a 0deg 45deg,
        #f8b229 45deg 90deg,
        #146b3a 90deg 135deg,
        #f8b229 135deg 180deg,
        #146b3a 180deg 225deg,
        #f8b229 225deg 270deg,
        #146b3a 270deg 315deg,
        #f8b229 315deg 360deg
      );
    }

    .mult-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      color: #fff;
      font-size: clamp(12px, 2.4vw, 18px);
      font-weight: bold;
      text-shadow: 0 0 3px #000;
      width: clamp(52px, 12vw, 80px);
      text-align: center;
      line-height: 1.1;
      pointer-events: none;
      user-select: none;
    }

    .mult-pointer {
      position: absolute;
      top: clamp(-16px, -2vw, -18px);
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: clamp(12px, 2.2vw, 18px) solid transparent;
      border-right: clamp(12px, 2.2vw, 18px) solid transparent;
      border-bottom: clamp(20px, 3.6vw, 30px) solid #ffffff;
      filter: drop-shadow(0 0 4px #000);
      z-index: 20;
    }

    .mult-spin-btn {
      display: none;
    }

    /* ---------- STATS / COUNTER ---------- */
    .sidebar {
      width: var(--sidebarW);
      height: var(--sidebarH);
      background: #181818;
      border-radius: 12px;
      padding: 16px 16px;
      box-shadow: 0 0 18px rgba(0,0,0,0.7);
      text-align: center;
      box-sizing: border-box;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .sidebar h2 {
      margin: 0 0 10px 0;
      font-size: clamp(18px, 4vw, 24px);
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      margin-bottom: 10px;
      font-size: clamp(14px, 3vw, 18px);
      flex-wrap: wrap;
    }

    .stats-row > div {
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-title {
      margin-top: 10px;
      font-size: clamp(14px, 3vw, 18px);
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }

    .history-box {
      margin-top: 10px;
      text-align: left;
      font-size: clamp(12px, 2.6vw, 15px);
      line-height: 1.4;
      height: 70px;
      overflow: hidden;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,0.35);
      border: 1px solid #333;
      box-sizing: border-box;
    }

    .history-line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reset-btn {
      margin-top: 10px;
      padding: 8px 14px;
      font-size: clamp(12px, 2.6vw, 15px);
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
      cursor: pointer;
    }

    /* ---------- PAYMENT SECTION ---------- */
    .pay-section {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .pay-btn {
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: clamp(12px, 2.6vw, 14px);
      text-decoration: none;
      letter-spacing: 0.5px;
      text-align: center;
      min-width: min(210px, 90%);
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .pay-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 18px rgba(0,0,0,0.9);
    }

    .v-btn {
      background: linear-gradient(135deg, #3D95CE, #1C6DB3);
      color: #ffffff;
    }

    .c-btn {
      background: linear-gradient(135deg, #00ffcc, #009988);
      color: #002222;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="wheels-row">
      <!-- MAIN CASH WHEEL -->
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <div id="wheel" class="wheel"></div>

        <div id="bigWinOverlay" class="big-win-overlay">
          🐷💰 CASH PIGGY BIG WIN! 💰🐷
        </div>

        <div id="sendNowOverlay" class="send-now-overlay">
          KEEP SPINNING PIG
        </div>

        <!-- PIG VIDEO (plays on $100 milestones only) -->
        <video id="pigVideo" class="pig-video" muted playsinline preload="auto">
          <source src="pig-video.mp4" type="video/mp4">
        </video>

        <button id="spinBtn" class="spin-btn">Spin</button>

        <!-- Audio -->
        <audio id="spinOink" src="pig-spin.mp3" preload="auto"></audio>
        <audio id="winOinks" src="pig-win.mp3" preload="auto"></audio>
        <audio id="bigWinSound" src="cash-win.mp3" preload="auto"></audio>
      </div>

      <!-- MULTIPLIER WHEEL (LOCKED UNTIL TOTAL >= 150) -->
      <div id="multWrapper" class="mult-wrapper">
        <div class="mult-title">Multiplier Wheel</div>
        <div id="multLocked" class="mult-locked">
          🔒 Locked – reach $150 total to unlock
        </div>

        <div class="mult-inner">
          <div class="mult-pointer"></div>
          <div id="multWheel" class="mult-wheel"></div>
          <button id="multSpinBtn" class="spin-btn mult-spin-btn">
            Spin Multiplier
          </button>
        </div>
      </div>

      <!-- SIDEBAR -->
      <div class="sidebar">
        <h2>Cash Piggy 🐷</h2>

        <div class="stats-row">
          <div>Total: <strong>$<span id="total">0</span></strong></div>
          <div>Spins: <strong><span id="spinCount">0</span></strong></div>
          <div>Last: <strong>$<span id="lastResult">–</span></strong></div>
        </div>

        <div class="history-title">Recent spins</div>
        <div class="history-box">
          <div class="history-line"><strong>Last:</strong> <span id="lastSpinLine">–</span></div>
          <div class="history-line"><strong>Prev:</strong> <span id="prevSpinLine">–</span></div>
        </div>

        <button id="resetBtn" class="reset-btn">Reset session</button>

        <div id="pay-section" class="pay-section">
          <a id="venmo-link" class="pay-btn v-btn" href="#" target="_blank" rel="noopener">
            SETTLE VIA VENMO
          </a>
          <a id="crypto-link" class="pay-btn c-btn" href="#" target="_blank" rel="noopener">
            SETTLE VIA USDC (BASE)
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ---------- DATA ---------- */
    const basePrizes = [5,10,15,20,25,30,35,40,45,50];
    const baseSliceCount = basePrizes.length;
    const baseSliceAngle = 360 / baseSliceCount;

    const baseMultipliers = [1.25,1.5,1.75,2,2.25,2.5,2.75,3];
    const multSliceCount = baseMultipliers.length;
    const multSliceAngle = 360 / multSliceCount;

    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const prizes = shuffleArray(basePrizes);
    const multipliers = shuffleArray(baseMultipliers);

    /* ---------- DOM ---------- */
    const wheel = document.getElementById("wheel");
    const spinBtn = document.getElementById("spinBtn");
    const resetBtn = document.getElementById("resetBtn");
    const bigWinOverlay = document.getElementById("bigWinOverlay");
    const sendNowOverlay = document.getElementById("sendNowOverlay");

    const pigVideo = document.getElementById("pigVideo");

    const multWrapper = document.getElementById("multWrapper");
    const multWheel = document.getElementById("multWheel");
    const multSpinBtn = document.getElementById("multSpinBtn");

    const totalEl = document.getElementById("total");
    const lastResultEl = document.getElementById("lastResult");
    const spinCountEl = document.getElementById("spinCount");

    const lastSpinLineEl = document.getElementById("lastSpinLine");
    const prevSpinLineEl = document.getElementById("prevSpinLine");

    const spinOink = document.getElementById("spinOink");
    const winOinks = document.getElementById("winOinks");
    const bigWinSound = document.getElementById("bigWinSound");

    /* ---------- PAYMENT LINKS ---------- */
    const venmoLink = document.getElementById("venmo-link");
    const cryptoLink = document.getElementById("crypto-link");
    venmoLink.href = "https://venmo.com/outcastjaxton";
    cryptoLink.href = "https://basescan.org/address/0x85B69e50083118DB2aa9d0FE8d0856bF131435bc";

    /* ---------- STATE ---------- */
    let baseRotation = 0;
    let multRotation = 0;
    let isSpinning = false;
    let total = 0;
    let spinCount = 0;
    let audioPrimed = false;
    let sendNowTimeoutId = null;

    let lastSpinText = "–";
    let prevSpinText = "–";

    let baseEndTimer = null;
    let multEndTimer = null;

    // VIDEO THRESHOLD: play at 100, 200, 300, ...
    let nextVideoMilestone = 100;
    let pigVideoTimer = null;

    /* ---------- LABELS ---------- */
    function createBaseLabels() {
      wheel.innerHTML = ""; // keep clean if reloaded
      const radius = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--mainWheel')) / 2) - 60;

      prizes.forEach((value, index) => {
        const label = document.createElement("div");
        label.className = "wheel-label";
        label.textContent = "$" + value;

        const angleDeg = index * baseSliceAngle;
        const angleRad = (angleDeg - 90) * Math.PI / 180;
        const x = radius * Math.cos(angleRad);
        const y = radius * Math.sin(angleRad);

        label.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
        wheel.appendChild(label);
      });
    }

    function createMultLabels() {
      multWheel.innerHTML = "";
      const radius = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--multWheel')) / 2) - 55;

      multipliers.forEach((value, index) => {
        const label = document.createElement("div");
        label.className = "mult-label";
        label.textContent = "x" + value.toString();

        const angleDeg = index * multSliceAngle;
        const angleRad = (angleDeg - 90) * Math.PI / 180;
        const x = radius * Math.cos(angleRad);
        const y = radius * Math.sin(angleRad);

        label.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
        multWheel.appendChild(label);
      });
    }

    createBaseLabels();
    createMultLabels();

    // Rebuild labels on resize so they stay centered nicely
    window.addEventListener("resize", () => {
      createBaseLabels();
      createMultLabels();
    });

    /* ---------- UTIL ---------- */
    function pickRandomIndex(len) {
      return Math.floor(Math.random() * len);
    }

    function playSoundSafe(audioEl) {
      if (!audioEl) return;
      try {
        audioEl.currentTime = 0;
        audioEl.play().catch(() => {});
      } catch (e) {}
    }

    function primeAudioIfNeeded() {
      if (audioPrimed) return;
      audioPrimed = true;
      const audios = [spinOink, winOinks, bigWinSound];
      audios.forEach(a => {
        if (!a) return;
        const originalVolume = a.volume;
        a.volume = 0;
        a.play().catch(() => {});
        setTimeout(() => {
          try { a.pause(); a.currentTime = 0; } catch (e) {}
          a.volume = originalVolume;
        }, 200);
      });
    }

    function showKeepSpinningPrompt() {
      if (sendNowTimeoutId !== null) clearTimeout(sendNowTimeoutId);
      sendNowOverlay.style.display = "block";
      sendNowTimeoutId = setTimeout(() => {
        sendNowOverlay.style.display = "none";
      }, 4000);
    }

    function showBigWin() {
      bigWinOverlay.style.display = "block";
      playSoundSafe(bigWinSound);
      setTimeout(() => {
        bigWinOverlay.style.display = "none";
      }, 3500);
    }

    function checkUnlockMultiplier() {
      if (total >= 150) {
        multWrapper.classList.add("unlocked");
      }
    }

    function updateRecentSpins(newText) {
      prevSpinText = lastSpinText;
      lastSpinText = newText;
      lastSpinLineEl.textContent = lastSpinText;
      prevSpinLineEl.textContent = prevSpinText;
    }

    function safeClearTimer(t) {
      if (t !== null) clearTimeout(t);
      return null;
    }

    /* ---------- PIG VIDEO LOGIC (MILESTONE-BASED) ---------- */
    function maybePlayPigVideo() {
      if (total < nextVideoMilestone) return;

      while (total >= nextVideoMilestone) {
        nextVideoMilestone += 100;
      }

      try {
        if (pigVideoTimer) {
          clearTimeout(pigVideoTimer);
          pigVideoTimer = null;
        }

        pigVideo.pause();
        pigVideo.currentTime = 0;
        pigVideo.style.display = "block";

        pigVideo.play().catch(() => {});

        pigVideoTimer = setTimeout(() => {
          try { pigVideo.pause(); } catch (e) {}
          pigVideo.style.display = "none";
        }, 3000);
      } catch (e) {
        pigVideo.style.display = "none";
      }
    }

    /* ---------- MAIN CASH WHEEL SPIN ---------- */
    function spinBaseWheel() {
      if (isSpinning) return;

      primeAudioIfNeeded();

      isSpinning = true;
      spinBtn.disabled = true;

      bigWinOverlay.style.display = "none";
      sendNowOverlay.style.display = "none";

      playSoundSafe(spinOink);

      const targetIndex = pickRandomIndex(prizes.length);
      const targetPrize = prizes[targetIndex];

      const targetSliceAngle = targetIndex * baseSliceAngle;
      const desiredFinal = (360 - targetSliceAngle) % 360;

      const extraTurns = 2 + Math.floor(Math.random() * 4);
      const fullRotationDegrees = extraTurns * 360;

      let delta = (desiredFinal - (baseRotation % 360) + 360) % 360;
      const newRotation = baseRotation + fullRotationDegrees + delta;

      wheel.style.transform = `rotate(${newRotation}deg)`;

      const finishBase = () => {
        baseEndTimer = safeClearTimer(baseEndTimer);
        wheel.removeEventListener("transitionend", onEnd);
        baseRotation = newRotation;

        playSoundSafe(winOinks);

        if (targetPrize === 50) showBigWin();

        total += targetPrize;
        spinCount++;

        totalEl.textContent = total;
        lastResultEl.textContent = targetPrize;
        spinCountEl.textContent = spinCount;

        updateRecentSpins(`Base: $${targetPrize}`);

        showKeepSpinningPrompt();
        checkUnlockMultiplier();
        maybePlayPigVideo();

        if (total >= 150) {
          spinMultiplierAuto(targetPrize);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
        }
      };

      const onEnd = (e) => {
        if (e.target !== wheel || e.propertyName !== "transform") return;
        finishBase();
      };

      wheel.addEventListener("transitionend", onEnd);

      baseEndTimer = safeClearTimer(baseEndTimer);
      baseEndTimer = setTimeout(finishBase, 8200);
    }

    /* ---------- MULTIPLIER WHEEL SPIN (AUTO AFTER UNLOCK) ---------- */
    function spinMultiplierAuto(baseAmount) {
      playSoundSafe(spinOink);

      const targetIndex = pickRandomIndex(multipliers.length);
      const multiplier = multipliers[targetIndex];

      const targetSliceAngle = targetIndex * multSliceAngle;
      const desiredFinal = (360 - targetSliceAngle) % 360;

      const extraTurns = 2 + Math.floor(Math.random() * 4);
      const fullRotationDegrees = extraTurns * 360;

      let delta = (desiredFinal - (multRotation % 360) + 360) % 360;
      const newRotation = multRotation + fullRotationDegrees + delta;

      // Safari/IOS nudge to ensure transform transition always triggers
      void multWheel.offsetWidth;
      multWheel.style.transform = `rotate(${newRotation}deg)`;

      const finishMult = () => {
        multEndTimer = safeClearTimer(multEndTimer);
        multWheel.removeEventListener("transitionend", onEnd);
        multRotation = newRotation;

        playSoundSafe(winOinks);

        const raw = baseAmount * multiplier;
        const payout = Math.round(raw / 5) * 5;

        total += payout;
        spinCount++;

        totalEl.textContent = total;
        lastResultEl.textContent = payout;
        spinCountEl.textContent = spinCount;

        updateRecentSpins(`Mult: x${multiplier} on $${baseAmount} → $${payout}`);

        if (payout >= 100) showBigWin();

        showKeepSpinningPrompt();
        checkUnlockMultiplier();
        maybePlayPigVideo();

        isSpinning = false;
        spinBtn.disabled = false;
      };

      const onEnd = (e) => {
        if (e.target !== multWheel || e.propertyName !== "transform") return;
        finishMult();
      };

      multWheel.addEventListener("transitionend", onEnd);

      multEndTimer = safeClearTimer(multEndTimer);
      multEndTimer = setTimeout(finishMult, 8200);
    }

    /* ---------- RESET ---------- */
    function resetSession() {
      baseEndTimer = safeClearTimer(baseEndTimer);
      multEndTimer = safeClearTimer(multEndTimer);

      if (pigVideoTimer) {
        clearTimeout(pigVideoTimer);
        pigVideoTimer = null;
      }
      try { pigVideo.pause(); } catch (e) {}
      pigVideo.style.display = "none";

      if (spinCount > 0) {
        const summary =
          `Cash Piggy Session Summary\n\n` +
          `Spins: ${spinCount}\n` +
          `Total: $${total}\n\n` +
          `Last spin: ${lastResultEl.textContent === "–" ? "N/A" : "$" + lastResultEl.textContent}`;
        alert(summary);
      }

      total = 0;
      spinCount = 0;
      totalEl.textContent = "0";
      spinCountEl.textContent = "0";
      lastResultEl.textContent = "–";

      bigWinOverlay.style.display = "none";
      sendNowOverlay.style.display = "none";

      multWrapper.classList.remove("unlocked");

      isSpinning = false;
      spinBtn.disabled = false;

      lastSpinText = "–";
      prevSpinText = "–";
      lastSpinLineEl.textContent = "–";
      prevSpinLineEl.textContent = "–";

      nextVideoMilestone = 100;
    }

    /* ---------- EVENTS ---------- */
    spinBtn.addEventListener("click", spinBaseWheel);

    multSpinBtn.addEventListener("click", () => {
      alert("Multiplier spins automatically after unlock.");
    });

    resetBtn.addEventListener("click", resetSession);
  </script>
</body>
</html>
