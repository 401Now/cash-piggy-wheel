<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Piggy Wheel 🐷💰</title>
  <style>
    /*
      =======================================================
      FIXED RESPONSIVE CSS
      =======================================================
    */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ff99cc 0, #111 55%);
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden; /* Keeps UI locked in place */
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 95%;
      max-width: 1200px;
      transform: scale(0.9); /* Slight global scale down to ensure padding */
    }

    .wheels-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap; /* Wraps on mobile so nothing gets cut off */
    }

    /* ---------- MAIN WHEEL (Responsive) ---------- */
    .wheel-wrapper {
      position: relative;
      width: 500px; /* Reduced from 640px */
      height: 500px;
      max-width: 80vw;
      max-height: 50vh; /* Limits height so it can't go off screen */
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #ff66aa;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
      position: relative;
      transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1);
      background: conic-gradient(
        #c40000 0deg 36deg, #000000 36deg 72deg, #c40000 72deg 108deg,
        #000000 108deg 144deg, #c40000 144deg 180deg, #000000 180deg 216deg,
        #c40000 216deg 252deg, #000000 252deg 288deg, #c40000 288deg 324deg,
        #000000 324deg 360deg
      );
    }

    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 0 3px #000;
      width: 60px;
      text-align: center;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 25px solid #ffffff;
      z-index: 20;
    }

    .send-now-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #ffcc00;
      color: #ffcc00;
      font-size: 18px;
      font-weight: 900;
      display: none;
      z-index: 40;
      animation: send-flash 1s linear infinite;
    }

    @keyframes send-flash {
      0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
    }

    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 12px 25px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff66aa, #ff3366);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 35;
    }

    /* ---------- MULTIPLIER (Responsive) ---------- */
    .mult-wrapper { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mult-inner { position: relative; width: 250px; height: 250px; display: none; }
    .mult-wheel {
      width: 100%; height: 100%; border-radius: 50%; border: 6px solid #44ddaa;
      position: relative; transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1);
      background: conic-gradient(#146b3a 0deg 45deg, #f8b229 45deg 90deg, #146b3a 90deg 135deg, #f8b229 135deg 180deg, #146b3a 180deg 225deg, #f8b229 225deg 270deg, #146b3a 270deg 315deg, #f8b229 315deg 360deg);
    }

    /* ---------- SIDEBAR / PAYMENTS ---------- */
    .sidebar { width: 100%; max-width: 450px; background: #181818; border-radius: 12px; padding: 15px; text-align: center; }
    .pay-section { display: none; margin: 10px 0; flex-direction: column; gap: 8px; align-items: center; }
    .pay-btn { display: flex; align-items: center; justify-content: center; width: 90%; padding: 10px; border-radius: 30px; text-decoration: none; font-weight: bold; color: white; font-size: 13px; }
    .v-btn { background: #008CFF; }
    .c-btn { background: #2775ca; }

    /* ---------- VIDEO ---------- */
    .video-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center; z-index: 100; }
    .video-container { position: relative; width: 90%; max-width: 600px; background: #111; padding: 10px; border: 4px solid #00ff66; border-radius: 10px; }
    #piggyVideo { width: 100%; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="app">
    <div id="videoModal" class="video-modal-overlay">
      <div class="video-container">
        <video id="piggyVideo" controls preload="auto">
          <source src="piggy-video.mp4" type="video/mp4">
        </video>
      </div>
    </div>
    
    <div class="wheels-row">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <div id="wheel" class="wheel"></div>
        <div id="sendNowOverlay" class="send-now-overlay"></div>
        <button id="spinBtn" class="spin-btn">Spin</button>
      </div>

      <div id="multWrapper" class="mult-wrapper">
        <div class="mult-title" style="font-size: 14px;">Multiplier</div>
        <div id="multLocked" class="mult-locked" style="font-size: 12px; opacity: 0.7;">🔒 reach $150</div>
        <div class="mult-inner" id="multInner">
          <div id="multWheel" class="mult-wheel"></div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div style="display:flex; justify-content:space-around; font-size: 16px; margin-bottom: 10px;">
        <div>Total: <strong>$<span id="total">0</span></strong></div>
        <div>Spins: <strong><span id="spinCount">0</span></strong></div>
      </div>

      <div id="pay-section" class="pay-section">
        <a id="venmo-link" class="pay-btn v-btn" href="#">VENMO PIGGY</a>
        <a id="crypto-link" class="pay-btn c-btn" href="#">USDC (BASE)</a>
      </div>

      <ul id="history" style="list-style:none; padding:0; font-size:12px; max-height:80px; overflow-y:auto; text-align:left; border-top:1px solid #333; margin-top:5px;"></ul>
      <button id="resetBtn" style="background:none; border:none; color:#666; text-decoration:underline; font-size:10px; cursor:pointer; margin-top:5px;">Reset Game</button>
    </div>
  </div>

  <script>
    const venmoUser = "outcastjaxton";
    const usdcAddress = "0x7a890107E81851d17D8899E6784386d57EdcF141";
    const TRIGGER_AMOUNT = 100;
    const ANIM_TIME = 8000;

    const randomCaptions = ["WHO IS A GOOD PIG?", "THERE YOU GO", "YOU KNOW YOU LOVE IT", "KEEP SPINNING PIGGY"];
    const prizes = [5,10,15,20,25,30,35,40,45,50].sort(() => Math.random() - 0.5);
    const multipliers = [1.25,1.5,1.75,2,2.25,2.5,2.75,3].sort(() => Math.random() - 0.5);

    const wheel = document.getElementById("wheel");
    const multWheel = document.getElementById("multWheel");
    const spinBtn = document.getElementById("spinBtn");
    const totalEl = document.getElementById("total");
    const historyEl = document.getElementById("history");
    const paySection = document.getElementById("pay-section");

    let baseRotation = 0, multRotation = 0, total = 0, spinCount = 0, isSpinning = false;

    function createLabels(target, data, radius, prefix) {
      const step = 360 / data.length;
      data.forEach((val, i) => {
        const label = document.createElement("div");
        label.className = "wheel-label";
        label.textContent = prefix + val;
        const rad = (i * step - 90) * Math.PI / 180;
        label.style.transform = `translate(-50%, -50%) translate(${radius * Math.cos(rad)}px, ${radius * Math.sin(rad)}px)`;
        target.appendChild(label);
      });
    }
    createLabels(wheel, prizes, 200, "$");
    createLabels(multWheel, multipliers, 100, "x");

    function updatePayments() {
      if (total > 0) {
        paySection.style.display = "flex";
        document.getElementById('venmo-link').href = `venmo://paycharge?txn=pay&recipients=${venmoUser}&amount=${total}&note=support`;
        document.getElementById('crypto-link').href = `ethereum:${usdcAddress}@8453/transfer?address=${usdcAddress}&uint256=${total}e6`;
      }
    }

    function spinBaseWheel() {
      if (isSpinning) return;
      isSpinning = true; spinBtn.disabled = true;
      const prevTotal = total;
      const idx = Math.floor(Math.random() * prizes.length);
      const prize = prizes[idx];
      const delta = ((360 - (idx * 36)) % 360 - (baseRotation % 360) + 360) % 360;
      baseRotation += (1440 + delta);
      wheel.style.transform = `rotate(${baseRotation}deg)`;

      setTimeout(() => {
        total += prize; spinCount++;
        totalEl.textContent = total;
        addHistory(`Spin: $${prize}`);
        if (total >= 150) spinMultiplier(prize, prevTotal);
        else finishSpin(prevTotal);
      }, ANIM_TIME);
    }

    function spinMultiplier(baseAmt, prevTotal) {
      document.getElementById("multLocked").style.display = "none";
      document.getElementById("multInner").style.display = "block";
      const idx = Math.floor(Math.random() * multipliers.length);
      const mult = multipliers[idx];
      const delta = ((360 - (idx * 45)) % 360 - (multRotation % 360) + 360) % 360;
      multRotation += (1080 + delta);
      multWheel.style.transform = `rotate(${multRotation}deg)`;

      setTimeout(() => {
        const payout = Math.round((baseAmt * mult) / 5) * 5;
        total += (payout - baseAmt);
        totalEl.textContent = total;
        addHistory(`Multiplier x${mult}: $${payout}`);
        finishSpin(prevTotal);
      }, ANIM_TIME);
    }

    function finishSpin(prevTotal) {
      isSpinning = false; spinBtn.disabled = false;
      updatePayments();
      if (Math.floor(total/TRIGGER_AMOUNT) > Math.floor(prevTotal/TRIGGER_AMOUNT)) {
        const modal = document.getElementById("videoModal");
        const video = document.getElementById("piggyVideo");
        modal.style.display = "flex";
        video.play();
        setTimeout(() => { modal.style.display="none"; video.pause(); video.currentTime=0; }, 3000);
      }
    }

    function addHistory(txt) {
      const li = document.createElement("li"); li.textContent = txt;
      historyEl.prepend(li);
    }

    spinBtn.addEventListener("click", spinBaseWheel);
    document.getElementById("resetBtn").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
