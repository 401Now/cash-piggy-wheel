<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash Piggy Wheel 🐷💰</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ff99cc 0, #111 55%);
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      padding: 10px;
    }

    /* Fixed Stats Header */
    .stats-header {
      width: 100%;
      display: flex;
      justify-content: space-around;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      z-index: 50;
    }

    .wheels-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 420px; /* Locked height to prevent shifting */
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
    }

    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #ff66aa;
      transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1);
      background: conic-gradient(
        #c40000 0deg 36deg, #000000 36deg 72deg, #c40000 72deg 108deg,
        #000000 108deg 144deg, #c40000 144deg 180deg, #000000 180deg 216deg,
        #c40000 216deg 252deg, #000000 252deg 288deg, #c40000 288deg 324deg,
        #000000 324deg 360deg
      );
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 20px solid #fff;
      z-index: 30;
    }

    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      border-radius: 50px;
      background: #ff3366;
      color: white;
      border: none;
      font-weight: bold;
      z-index: 40;
      cursor: pointer;
    }

    /* Multiplier Wheel */
    .mult-inner {
      position: relative;
      width: 180px;
      height: 180px;
      display: none; /* Shown via JS */
    }

    .mult-wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 4px solid #44ddaa;
      transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1);
      background: conic-gradient(#146b3a 0deg 45deg, #f8b229 45deg 90deg, #146b3a 90deg 135deg, #f8b229 135deg 180deg, #146b3a 180deg 225deg, #f8b229 225deg 270deg, #146b3a 270deg 315deg, #f8b229 315deg 360deg);
    }

    /* History and Payments */
    .bottom-section {
      width: 100%;
      background: #181818;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .recent-list {
      list-style: none;
      padding: 0;
      margin: 5px 0;
      font-size: 13px;
      color: #aaa;
    }

    .history-dropdown {
      display: none;
      max-height: 80px;
      overflow-y: auto;
      font-size: 11px;
      border-top: 1px solid #333;
      margin-top: 5px;
    }

    .toggle-btn {
      background: none;
      border: none;
      color: #ff66aa;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
    }

    .pay-btn {
      display: inline-block;
      width: 45%;
      padding: 8px;
      margin: 5px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      color: white;
      font-size: 12px;
    }

    .video-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9);
      display: none; justify-content: center; align-items: center; z-index: 100;
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="videoModal" class="video-modal-overlay">
      <video id="piggyVideo" style="width:90%; max-width:500px;" preload="auto">
        <source src="piggy-video.mp4" type="video/mp4">
      </video>
    </div>

    <div class="stats-header">
      <div>Debt: <strong id="total">$0</strong></div>
      <div>Spins: <strong id="spinCount">0</strong></div>
    </div>

    <div class="wheels-container">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <div id="wheel" class="wheel"></div>
        <button id="spinBtn" class="spin-btn">SPIN</button>
      </div>

      <div id="multWrapper" class="mult-inner">
        <div class="pointer" style="scale: 0.7; top: -5px;"></div>
        <div id="multWheel" class="mult-wheel"></div>
      </div>
    </div>

    <div class="bottom-section">
      <ul id="recentHistory" class="recent-list"></ul>
      <button class="toggle-btn" onclick="toggleHistory()">View Full History</button>
      <div id="fullHistory" class="history-dropdown"></div>

      <div id="pay-section" style="display:none; margin-top:10px;">
        <a id="v-link" class="pay-btn" style="background:#008CFF;" href="#">VENMO</a>
        <a id="c-link" class="pay-btn" style="background:#2775ca;" href="#">USDC</a>
      </div>
    </div>
  </div>

  <script>
    const venmoUser = "outcastjaxton";
    const usdcAddr = "0x7a890107E81851d17D8899E6784386d57EdcF141";
    const prizes = [5,10,15,20,25,30,35,40,45,50].sort(() => Math.random() - 0.5);
    const multipliers = [1.25,1.5,1.75,2,2.25,2.5,2.75,3].sort(() => Math.random() - 0.5);

    let total = 0, spins = 0, isSpinning = false, bRot = 0, mRot = 0;
    let historyData = [];

    function spin() {
      if (isSpinning) return;
      isSpinning = true;
      const prevTotal = total;
      const idx = Math.floor(Math.random() * 10);
      const prize = prizes[idx];
      bRot += 1440 + (360 - (idx * 36));
      document.getElementById('wheel').style.transform = `rotate(${bRot}deg)`;

      setTimeout(() => {
        total += prize; spins++;
        updateUI(`+$${prize}`);
        if (total >= 150) {
          document.getElementById('multWrapper').style.display = 'block';
          runMultiplier(prize, prevTotal);
        } else {
          checkVideo(prevTotal);
          isSpinning = false;
        }
      }, 8000);
    }

    function runMultiplier(base, prev) {
      const idx = Math.floor(Math.random() * 8);
      const m = multipliers[idx];
      mRot += 1080 + (360 - (idx * 45));
      document.getElementById('multWheel').style.transform = `rotate(${mRot}deg)`;

      setTimeout(() => {
        const bonus = Math.round((base * m) / 5) * 5;
        total += (bonus - base);
        updateUI(`x${m} Multiplier!`);
        checkVideo(prev);
        isSpinning = false;
      }, 8000);
    }

    function updateUI(msg) {
      document.getElementById('total').textContent = `$${total}`;
      document.getElementById('spinCount').textContent = spins;
      historyData.unshift(msg);
      
      // Update Recent 3
      const recent = document.getElementById('recentHistory');
      recent.innerHTML = historyData.slice(0, 3).map(m => `<li>${m}</li>`).join('');
      
      // Update Full
      document.getElementById('fullHistory').innerHTML = historyData.map(m => `<div>${m}</div>`).join('');
      
      if (total > 0) {
        document.getElementById('pay-section').style.display = 'block';
        document.getElementById('v-link').href = `venmo://paycharge?txn=pay&recipients=${venmoUser}&amount=${total}&note=drain`;
        document.getElementById('c-link').href = `ethereum:${usdcAddr}@8453/transfer?address=${usdcAddr}&uint256=${total}e6`;
      }
    }

    function checkVideo(prev) {
      if (Math.floor(total/100) > Math.floor(prev/100)) {
        const modal = document.getElementById('videoModal');
        const v = document.getElementById('piggyVideo');
        modal.style.display = 'flex';
        v.play();
        setTimeout(() => { modal.style.display='none'; v.pause(); v.currentTime=0; }, 3000);
      }
    }

    function toggleHistory() {
      const div = document.getElementById('fullHistory');
      div.style.display = div.style.display === 'block' ? 'none' : 'block';
    }

    document.getElementById('spinBtn').onclick = spin;
  </script>
</body>
</html>
