<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cash Piggy Wheel 🐷💰 (Video Trigger $100 Increment)</title>
  <style>
    /*
      =======================================================
      CSS STYLES
      =======================================================
    */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #ff99cc 0, #111 55%);
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .wheels-row {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 16px;
    }

    .wheel-wrapper {
      position: relative;
      width: 640px;
      height: 640px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel {
      width: 600px;
      height: 600px;
      border-radius: 50%;
      border: 10px solid #ff66aa;
      box-shadow: 0 0 24px rgba(0,0,0,0.9);
      position: relative;
      transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1);
      transform: rotate(0deg);
      background: conic-gradient(
        #c40000 0deg 36deg,
        #000000 36deg 72deg,
        #c40000 72deg 108deg,
        #000000 108deg 144deg,
        #c40000 144deg 180deg,
        #000000 180deg 216deg,
        #c40000 216deg 252deg,
        #000000 252deg 288deg,
        #c40000 288deg 324deg,
        #000000 324deg 360deg
      );
    }

    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 0 3px #000;
      width: 80px;
      text-align: center;
      line-height: 1.1;
    }

    .pointer {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-bottom: 34px solid #ffffff;
      filter: drop-shadow(0 0 4px #000);
      z-index: 20;
    }

    .send-now-overlay {
      position: absolute;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ffcc00;
      color: #ffcc00;
      font-size: 24px;
      font-weight: 900;
      text-shadow: 0 0 6px #000;
      display: none;
      white-space: nowrap;
      z-index: 40;
      animation: send-flash 1s linear infinite;
    }

    @keyframes send-flash {
      0%   { opacity: 0.1; transform: translate(-50%, -50%) scale(0.95); }
      50%  { opacity: 1;   transform: translate(-50%, -50%) scale(1.05); }
      100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.98); }
    }

    .spin-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 14px 32px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff66aa, #ff3366);
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(0,0,0,0.8);
      z-index: 35;
    }
    .spin-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ---------- MULTIPLIER WHEEL ---------- */
    .mult-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px; }
    .mult-title { font-size: 18px; margin-bottom: 2px; }
    .mult-locked { font-size: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,0.7); border: 1px solid #888; color: #ddd; white-space: nowrap; }
    .mult-inner { position: relative; width: 380px; height: 380px; display: none; align-items: center; justify-content: center; }
    .mult-wrapper.unlocked .mult-inner { display: flex; }
    .mult-wrapper.unlocked .mult-locked { display: none; }
    .mult-wheel {
      width: 350px; height: 350px; border-radius: 50%; border: 8px solid #44ddaa; box-shadow: 0 0 18px rgba(0,0,0,0.9);
      position: relative; transition: transform 8s cubic-bezier(0.15, 0.85, 0.25, 1); transform: rotate(0deg);
      background: conic-gradient(#146b3a 0deg 45deg, #f8b229 45deg 90deg, #146b3a 90deg 135deg, #f8b229 135deg 180deg, #146b3a 180deg 225deg, #f8b229 225deg 270deg, #146b3a 270deg 315deg, #f8b229 315deg 360deg);
    }
    .mult-label { position: absolute; left: 50%; top: 50%; transform-origin: center center; color: #fff; font-size: 18px; font-weight: bold; text-shadow: 0 0 3px #000; width: 80px; text-align: center; line-height: 1.1; }
    .mult-pointer { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 30px solid #ffffff; filter: drop-shadow(0 0 4px #000); z-index: 20; }

    /* ---------- SIDEBAR / PAYMENTS ---------- */
    .sidebar { width: 100%; max-width: 520px; background: #181818; border-radius: 12px; padding: 20px 22px; box-shadow: 0 0 18px rgba(0,0,0,0.7); text-align: center; }
    .stats-row { display: flex; justify-content: space-around; margin-bottom: 15px; font-size: 18px; }
    
    .pay-section { display: none; margin: 15px 0; flex-direction: column; gap: 10px; align-items: center; }
    .pay-btn { display: flex; align-items: center; justify-content: center; width: 80%; padding: 12px; border-radius: 30px; text-decoration: none; font-weight: bold; color: white; font-size: 14px; }
    .v-btn { background: #008CFF; }
    .c-btn { background: #2775ca; border: 1px solid #4a90e2; }
    .copy-addr { font-size: 10px; color: #555; cursor: pointer; text-decoration: underline; margin-top: 4px; }

    .history { list-style: none; padding-left: 0; max-height: 140px; overflow-y: auto; font-size: 13px; text-align: left; margin: 0; border-top: 1px solid #333; padding-top: 10px; }
    .reset-btn { margin-top: 12px; padding: 8px 14px; font-size: 12px; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; cursor: pointer; }
    
    /* ---------- VIDEO MODAL ---------- */
    .video-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); display: none; justify-content: center; align-items: center; z-index: 100; }
    .video-container { position: relative; width: 90%; max-width: 800px; background: #111; padding: 20px; border-radius: 10px; box-shadow: 0 0 30px rgba(0, 255, 102, 0.8); border: 5px solid #00ff66; }
    .close-btn { position: absolute; top: 5px; right: 15px; color: #00ff66; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 101; }
    #piggyVideo { width: 100%; max-height: 80vh; }
  </style>
</head>
<body>
  <div class="app">
    <div id="videoModal" class="video-modal-overlay">
      <div class="video-container">
        <span class="close-btn" id="closeVideoBtn">&times;</span>
        <video id="piggyVideo" controls preload="auto">
          <source src="piggy-video.mp4" type="video/mp4">
        </video>
      </div>
    </div>
    
    <div class="wheels-row">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <div id="wheel" class="wheel"></div>
        <div id="sendNowOverlay" class="send-now-overlay"></div>
        <button id="spinBtn" class="spin-btn">Spin</button>
        <audio id="spinOink" src="pig-spin.mp3" preload="auto"></audio>
        <audio id="winOinks" src="pig-win.mp3" preload="auto"></audio>
        <audio id="bigWinSound" src="cash-win.mp3" preload="auto"></audio>
      </div>

      <div id="multWrapper" class="mult-wrapper">
        <div class="mult-title">Multiplier Wheel</div>
        <div id="multLocked" class="mult-locked">🔒 reach $150 to unlock</div>
        <div class="mult-inner">
          <div class="mult-pointer"></div>
          <div id="multWheel" class="mult-wheel"></div>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="stats-row">
        <div>Total Debt: <strong>$<span id="total">0</span></strong></div>
        <div>Spins: <strong><span id="spinCount">0</span></strong></div>
      </div>

      <div id="pay-section" class="pay-section">
        <a id="venmo-link" class="pay-btn v-btn" href="#">SETTLE VIA VENMO</a>
        <a id="crypto-link" class="pay-btn c-btn" href="#">SETTLE VIA CRYPTO</a>
        <div class="copy-addr" onclick="copyAddress()">Copy USDC Base Address</div>
      </div>

      <ul id="history" class="history"></ul>
      <button id="resetBtn" class="reset-btn">Reset session</button>
    </div>
  </div>

  <script>
    /* ---------- CONFIGURATION ---------- */
    const venmoUser = "outcastjaxton";
    const usdcAddress = "0x7a890107E81851d17D8899E6784386d57EdcF141";
    const TRIGGER_AMOUNT = 100;
    const ANIMATION_DURATION_MS = 8000;

    const randomCaptions = [
      "WHO IS A GOOD PIG?", "THERE YOU GO", "YOU KNOW YOU LOVE IT", "YOU KNOW I LOVE DRAINING YOU",
      "THE MORE YOU SPIN THE MORE I'LL STRETCH YOU", "KEEP SPINNING PIGGY", "OINK OINK CASH PIG",
      "IM GOING TO TURN YOU INTO MY TOILET", "THINK ABOUT THAT GOLDEN LIQUID RUNNING DOWN YOUR THROAT"
    ];

    const prizes = [5,10,15,20,25,30,35,40,45,50].sort(() => Math.random() - 0.5);
    const multipliers = [1.25,1.5,1.75,2,2.25,2.5,2.75,3].sort(() => Math.random() - 0.5);

    /* ---------- DOM ---------- */
    const wheel = document.getElementById("wheel");
    const multWheel = document.getElementById("multWheel");
    const spinBtn = document.getElementById("spinBtn");
    const totalEl = document.getElementById("total");
    const historyEl = document.getElementById("history");
    const paySection = document.getElementById("pay-section");

    let baseRotation = 0, multRotation = 0, total = 0, spinCount = 0, isSpinning = false;

    /* ---------- INITIALIZE LABELS ---------- */
    function createLabels(target, data, radius, prefix) {
      const angleStep = 360 / data.length;
      data.forEach((val, i) => {
        const label = document.createElement("div");
        label.className = target.id === "wheel" ? "wheel-label" : "mult-label";
        label.textContent = prefix + val;
        const rad = (i * angleStep - 90) * Math.PI / 180;
        label.style.transform = `translate(-50%, -50%) translate(${radius * Math.cos(rad)}px, ${radius * Math.sin(rad)}px)`;
        target.appendChild(label);
      });
    }
    createLabels(wheel, prizes, 260, "$");
    createLabels(multWheel, multipliers, 135, "x");

    /* ---------- CORE LOGIC ---------- */
    function updatePayments() {
      if (total > 0) {
        paySection.style.display = "flex";
        const note = encodeURIComponent("small business support");
        document.getElementById('venmo-link').href = `venmo://paycharge?txn=pay&recipients=${venmoUser}&amount=${total}&note=${note}`;
        document.getElementById('crypto-link').href = `ethereum:${usdcAddress}@8453/transfer?address=${usdcAddress}&uint256=${total}e6`;
        document.getElementById('crypto-link').innerHTML = `PAY ${total} USDC (BASE)`;
      }
    }

    function spinBaseWheel() {
      if (isSpinning) return;
      isSpinning = true; spinBtn.disabled = true;
      const prevTotal = total;
      const targetIdx = Math.floor(Math.random() * prizes.length);
      const targetPrize = prizes[targetIdx];
      const delta = ( (360 - (targetIdx * (360/prizes.length))) % 360 - (baseRotation % 360) + 360) % 360;
      baseRotation += (1440 + delta);
      wheel.style.transition = `transform ${ANIMATION_DURATION_MS/1000}s cubic-bezier(0.15, 0.85, 0.25, 1)`;
      wheel.style.transform = `rotate(${baseRotation}deg)`;

      setTimeout(() => {
        total += targetPrize; spinCount++;
        totalEl.textContent = total;
        addHistory(`Base spin: $${targetPrize}`);
        if (total >= 150) spinMultiplier(targetPrize, prevTotal);
        else finishSpin(prevTotal);
      }, ANIMATION_DURATION_MS);
    }

    function spinMultiplier(baseAmt, prevTotal) {
      document.getElementById("multWrapper").classList.add("unlocked");
      const targetIdx = Math.floor(Math.random() * multipliers.length);
      const mult = multipliers[targetIdx];
      const delta = ( (360 - (targetIdx * (360/multipliers.length))) % 360 - (multRotation % 360) + 360) % 360;
      multRotation += (1080 + delta);
      multWheel.style.transition = `transform ${ANIMATION_DURATION_MS/1000}s cubic-bezier(0.15, 0.85, 0.25, 1)`;
      multWheel.style.transform = `rotate(${multRotation}deg)`;

      setTimeout(() => {
        const payout = Math.round((baseAmt * mult) / 5) * 5;
        total += (payout - baseAmt);
        totalEl.textContent = total;
        addHistory(`Multiplier x${mult}: Total Payout $${payout}`);
        finishSpin(prevTotal);
      }, ANIMATION_DURATION_MS);
    }

    function finishSpin(prevTotal) {
      isSpinning = false; spinBtn.disabled = false;
      updatePayments();
      
      // Trigger video on $100 increments
      if (Math.floor(total/TRIGGER_AMOUNT) > Math.floor(prevTotal/TRIGGER_AMOUNT)) {
        const modal = document.getElementById("videoModal");
        const video = document.getElementById("piggyVideo");
        modal.style.display = "flex";
        video.play();
        
        // AUTOMATIC CLOSE after exactly 3 seconds
        setTimeout(hideVideoModal, 3000); 
      }
    }

    function hideVideoModal() {
      const modal = document.getElementById("videoModal");
      const video = document.getElementById("piggyVideo");
      modal.style.display = "none";
      video.pause();
      video.currentTime = 0; // Reset video for next trigger
    }

    function addHistory(txt) {
      const li = document.createElement("li"); li.textContent = txt;
      historyEl.prepend(li);
    }

    function copyAddress() {
      navigator.clipboard.writeText(usdcAddress); alert("Address Copied!");
    }

    /* ---------- EVENT LISTENERS ---------- */
    spinBtn.addEventListener("click", spinBaseWheel);
    document.getElementById("closeVideoBtn").addEventListener("click", hideVideoModal);
    document.getElementById("piggyVideo").addEventListener('ended', hideVideoModal);
    document.getElementById("resetBtn").addEventListener("click", () => location.reload());
  </script>
</body>
</html>
